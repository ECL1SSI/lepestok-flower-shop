name: Скриншоты и проверка интерфейса
on:
  push:
    branches: [main]
    paths-ignore: ['docs/screenshots/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demo
      - run: npm install --prefix tools/screenshots
      - run: npx --prefix tools/screenshots playwright install --with-deps chromium
      - name: Проверить интерфейс и снять экраны
        run: |
          mkdir -p /tmp/lepestok-preview/lepestok-flower-shop
          cp -R dist-demo/. /tmp/lepestok-preview/lepestok-flower-shop/
          python3 -m http.server 4173 --directory /tmp/lepestok-preview > /tmp/lepestok-preview.log 2>&1 &
          cd tools/screenshots
          node capture.mjs
        env:
          SITE_URL: http://127.0.0.1:4173/lepestok-flower-shop/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lepestok-screenshots
          path: docs/screenshots
      - name: Добавить скриншоты в репозиторий
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots README.md
          git diff --staged --quiet && exit 0
          git commit -m 'docs: обновить реальные снимки версии 2.0 [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
