name: Публикация магазина — Cloudflare
on:
  workflow_dispatch:
    inputs:
      demo_mode:
        description: 'Демонстрационная среда с двумя тестовыми аккаунтами'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: lepestok-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      DEMO_MODE: ${{ inputs.demo_mode && 'true' || 'false' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/configure-deployment.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate:remote
      - run: pnpm build
      - run: pnpm deploy
      - run: node scripts/upload-admin-secrets.mjs
