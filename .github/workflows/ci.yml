name: Проверки и сборка
on:
  push:
    branches: [main]
    paths-ignore: ['docs/screenshots/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: lepestok-worker-build
          path: dist
          retention-days: 7
